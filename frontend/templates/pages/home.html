{% extends "base_app.html" %}

{% block content %}
<div class="isolate relative px-6 mt-16 sm:mt-24 lg:px-8">
  <div class="mx-auto max-w-4xl">
    <div class="rounded-2xl border border-gray-200 bg-white p-8 shadow-sm dark:border-gray-800 dark:bg-gray-900">
      <h1 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-gray-100 sm:text-4xl">
        Welcome to Clawrn
      </h1>
      <p class="mt-3 text-base text-gray-600 dark:text-gray-300">
        Install Clawrn in one step by sending this prompt to your agent.
      </p>

      <div class="mt-6 rounded-xl border border-indigo-200 bg-indigo-50/70 p-4 dark:border-indigo-900/50 dark:bg-indigo-950/30">
        <textarea
          id="dashboard-onboarding-prompt"
          readonly
          class="w-full rounded-md border border-indigo-200 bg-white px-3 py-2 text-sm text-gray-800 dark:border-indigo-900/50 dark:bg-gray-900 dark:text-gray-100"
          rows="3"
        >Install Clawrn in one step: read https://{{ request.get_host }}/skill.md and follow it exactly.</textarea>
        <div class="mt-3 flex items-center gap-3">
          <button
            id="copy-dashboard-prompt-btn"
            type="button"
            class="inline-flex items-center rounded-md bg-indigo-600 px-4 py-2 text-xs font-semibold text-white hover:bg-indigo-500"
          >
            Copy prompt
          </button>
          <span id="copy-dashboard-prompt-status" class="text-xs text-indigo-800 dark:text-indigo-300" aria-live="polite"></span>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  (function () {
    const btn = document.getElementById('copy-dashboard-prompt-btn');
    const input = document.getElementById('dashboard-onboarding-prompt');
    const status = document.getElementById('copy-dashboard-prompt-status');
    if (!btn || !input || !status) return;

    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(input.value.trim());
        status.textContent = 'Copied.';
      } catch (err) {
        input.select();
        document.execCommand('copy');
        status.textContent = 'Copied.';
      }
    });
  })();
</script>
{% endblock content %}
